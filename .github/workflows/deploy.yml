name: Deploy OmniVis to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Build Launchpad
        run: |
          mkdir -p dist
          cp -r apps/launchpad/* dist/

      - name: Build Graphi
        env:
          BASE_PATH: /graphi
          HUSKY: "0"
        run: |
          cd apps/graphi
          pnpm install --ignore-scripts --no-frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm run build
          mkdir -p ../../dist/graphi
          cp -r build/. ../../dist/graphi/
          
      - name: Build Slidi
        env:
          NEXT_BASE_PATH: /slidi
          HUSKY: "0"
        run: |
          cd apps/slidi
          npm install --ignore-scripts
          npm run build
          mkdir -p ../../dist/slidi
          cp -r out/. ../../dist/slidi/

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/worker
          npm install
          npx wrangler deploy

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
