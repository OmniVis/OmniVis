name: Deploy OmniVis to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Build Launchpad
        run: |
          mkdir -p dist
          cp -r apps/launchpad/* dist/

      - name: Build Graphi
        env:
          BASE_PATH: /graphi
        run: |
          cd apps/graphi
          pnpm install
          pnpm run build
          cp -r build ../../dist/graphi || cp -r target ../../dist/graphi || cp -r .svelte-kit/output/prerendered/pages ../../dist/graphi || true
          
      - name: Build Slidi
        env:
          NEXT_BASE_PATH: /slidi
        run: |
          cd apps/slidi
          npm install
          npm run build
          cp -r out ../../dist/slidi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
