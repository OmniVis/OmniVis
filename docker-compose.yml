version: '3.8'

services:
  proxy:
    image: nginx:alpine
    container_name: tools-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - landing
      - graphi
    restart: always

  landing:
    build:
      context: ./landing-page
    container_name: tools-landing
    restart: always

  graphi:
    build:
      context: .
      args:
        BASE_PATH: /graphi
    container_name: tools-graphi
    restart: always
