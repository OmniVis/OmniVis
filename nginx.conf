worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Route standard root to the Hub / Landing Page
        location / {
            proxy_pass http://landing:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route /graphi/ strictly to the Graphi Editor container
        # Since Graphi is built into the /usr/share/nginx/html/graphi folder,
        # it expects requests inside that folder. We just proxy directly to the NGINX serving that static folder.
        location /graphi/ {
            proxy_pass http://graphi:80/graphi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}