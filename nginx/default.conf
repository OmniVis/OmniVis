server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect /edit (no trailing slash) to /edit/
    location = /edit {
        return 301 /edit/;
    }

    # Serve Graphi SPA under /edit/
    # try_files: serve the exact file, then a directory index, then fall back to
    # SvelteKit's 404.html which acts as the SPA entry point for client-side routes.
    # This is required because adapter-static uses fallback: '404.html'.
    location /edit/ {
        try_files $uri $uri/ /edit/404.html;
    }

    # Block all other paths - this container only serves /edit/
    location / {
        return 404;
    }
}
