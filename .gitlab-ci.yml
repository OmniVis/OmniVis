stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  VM_IP: "10.1.101.43"
  VM_USER: "root"
  DEPLOY_DIR: "/opt/graphi"
  SSH_OPTS: "-v -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o PasswordAuthentication=no"

build-graphi-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --build-arg BASE_PATH=/graphi -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
    - master

deploy-graphi:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r\n ' | base64 -d > /tmp/deploy_key
    - echo "" >> /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-keygen -y -f /tmp/deploy_key
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $VM_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SSH_OPTS $VM_USER@$VM_IP "mkdir -p $DEPLOY_DIR"
    - rsync -avz -e "ssh $SSH_OPTS" docker-compose.yml $VM_USER@$VM_IP:$DEPLOY_DIR/
    - ssh $SSH_OPTS $VM_USER@$VM_IP "cd $DEPLOY_DIR && podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh $SSH_OPTS $VM_USER@$VM_IP "cd $DEPLOY_DIR && podman-compose pull"
    - ssh $SSH_OPTS $VM_USER@$VM_IP "cd $DEPLOY_DIR && podman-compose up -d"
  after_script:
    - rm -f /tmp/deploy_key
  only:
    - main
    - master

