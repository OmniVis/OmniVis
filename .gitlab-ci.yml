stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  VM_IP: "10.1.101.43"
  VM_USER: "root"
  DEPLOY_DIR: "/opt/graphi"

build-graphi-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --build-arg BASE_PATH=/graphi -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
    - master

deploy-graphi:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VM_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VM_USER@$VM_IP "mkdir -p $DEPLOY_DIR"
    - rsync -avz -e "ssh -o StrictHostKeyChecking=no" docker-compose.yml $VM_USER@$VM_IP:$DEPLOY_DIR/
    - ssh $VM_USER@$VM_IP "cd $DEPLOY_DIR && podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && podman-compose pull && podman-compose up -d"
  only:
    - main
    - master
