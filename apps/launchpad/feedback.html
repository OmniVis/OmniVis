<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | AI Tools Hub</title>
    <link rel="icon" type="image/x-icon" href="/branding/launchpad_favicon.ico">
    <link rel="icon" type="image/png" href="/branding/launchpad_favicon.png">
    <link rel="apple-touch-icon" href="/branding/launchpad_favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-color: #FDFDFD;
            --card-bg: #ffffff;
            --card-border: rgba(15, 23, 42, 0.08);
            --accent-1: #0f172a;
            --accent-2: #334155;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-premium: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 0.75rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            border-bottom: 1px solid rgba(15, 23, 42, 0.05);
            background: rgba(253, 253, 253, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon img {
            height: 54px;
            width: auto;
            object-fit: contain;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
            z-index: 10;
        }

        .form-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 3rem;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow-premium);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-1);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--accent-2);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        button:active {
            transform: translateY(0);
        }

        /* Background glows */
        .bg-glow {
            position: fixed;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.03) 0%, transparent 70%);
            top: -30vh;
            left: -20vw;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <header>
        <div class="logo-container">
            <a href="/" class="logo-icon">
                <img src="/branding/launchpad-logo-lockup-on-light.png" alt="AI Hub Logo">
            </a>
        </div>
        <a href="/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Hub
        </a>
    </header>

    <main>
        <div class="form-container">
            <h1>Send Feedback</h1>
            <p class="subtitle">Help us improve the AI Tools Hub.</p>

            <form id="feedbackForm">
                <div class="form-group">
                    <label for="app">Application</label>
                    <select id="app" required>
                        <option value="Launchpad">Launchpad</option>
                        <option value="Slidi">Slidi</option>
                        <option value="Graphi">Graphi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="type">Type of Feedback</label>
                    <select id="type" required>
                        <option value="Bug Report">Bug Report</option>
                        <option value="UI Issue">UI Report/Bug</option>
                        <option value="Feature Request">Feature Request</option>
                        <option value="General">General Feedback</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Feedback</label>
                    <textarea id="message" placeholder="Describe your feedback in detail..." required></textarea>
                </div>

                <button type="submit">Send Feedback</button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const app = document.getElementById('app').value;
            const type = document.getElementById('type').value;
            const message = document.getElementById('message').value;
            
            const email = 'batu-atakan.erol@adesso.de';
            const subject = `AiTools Feedback - ${app} - ${type}`;
            const body = `Application: ${app}\nType: ${type}\n\nFeedback:\n${message}`;
            
            const mailtoUrl = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            
            window.location.href = mailtoUrl;
        });
    </script>
</body>

</html>
