server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Custom Error Pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Cache branding and static assets
    location /branding/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
