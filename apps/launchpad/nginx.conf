worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80 default_server;
        server_name aitools.test-server.ag 10.1.101.43;

        # Use Podman/Docker internal DNS - resolve at request time, not startup
        resolver 10.89.0.1 valid=30s ipv6=off;

        # Route standard root to the Hub / Landing Page
        location / {
            set $launchpad_upstream http://launchpad:80;
            proxy_pass $launchpad_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Slidi canonical handling
        # WebSocket proxy for the Slidi collab sidecar (must come before /slidi/ prefix block)
        location /slidi/collab {
            set $collab_upstream http://tools-slidi-collab:3001;
            proxy_pass $collab_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        location = /slidi {
            set $slidi_upstream http://tools-slidi:3000;
            proxy_pass $slidi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /slidi/ {
            return 308 /slidi;
        }

        location /slidi/ {
            set $slidi_upstream http://tools-slidi:3000;
            proxy_pass $slidi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Redirect /graphi (no trailing slash) so the SPA base path is always /graphi/
        location = /graphi {
            return 301 /graphi/;
        }

        # Route /graphi/ strictly to the Graphi Editor container
        location /graphi/ {
            set $graphi_upstream http://tools-graphi:3000;
            proxy_pass $graphi_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
