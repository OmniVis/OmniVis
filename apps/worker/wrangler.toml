name = "omnivis-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (set via CLOUDFLARE_ACCOUNT_ID secret in CI)
# account_id = ""

[[d1_databases]]
binding = "DB"
database_name = "omnivis-db"
database_id = "1aa0b512-ff19-408e-b4e0-e8f899175e07"

[vars]
# CORS origins allowed to call this worker
ALLOWED_ORIGINS = "https://omnivis.github.io,http://localhost:3000,http://localhost:5173"

# Add these as encrypted secrets via `wrangler secret put`:
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# AUTH_SECRET  (random 32+ char string for JWT signing)
