server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve favicons at root so the browser's automatic /favicon.ico
    # request doesn't hit the catch-all 404 block below.
    location = /favicon.ico {
        try_files /graphi/graphi_favicon.ico =404;
    }
    location = /favicon.png {
        try_files /graphi/graphi_favicon.png =404;
    }

    # Redirect /graphi (no trailing slash) to /graphi/
    location = /graphi {
        return 301 /graphi/;
    }

    # Serve Graphi SPA under /graphi/
    # try_files: serve the exact file, then a directory index, then fall back to
    # SvelteKit's 404.html which acts as the SPA entry point for client-side routes.
    # This is required because adapter-static uses fallback: '404.html'.
    location /graphi/ {
        try_files $uri $uri/ /graphi/404.html;
    }

    # Block all other paths - this container only serves /graphi/
    location / {
        return 404;
    }
}
